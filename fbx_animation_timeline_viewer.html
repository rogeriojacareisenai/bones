<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBX Animation Studio - Sync & Independent Keyframe Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darker: '#090d16',
                        card: '#131b2e',
                        accent: '#3b82f6'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js e Dependências -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        .timeline-container { background-color: #0f172a; border-top: 1px solid #334155; user-select: none; }
        .timeline-ruler { background: linear-gradient(to bottom, #1e293b, #0f172a); border-bottom: 1px solid #475569; height: 26px; position: relative; cursor: pointer; }
        .timeline-frame-tick { position: absolute; bottom: 0; border-left: 1px solid #64748b; height: 6px; }
        .timeline-frame-tick.major { height: 12px; border-left-color: #94a3b8; }
        .timeline-frame-number { position: absolute; top: 2px; font-size: 9px; font-family: monospace; color: #94a3b8; transform: translateX(-50%); }
        
        .track-lane { height: 32px; background-color: #1a2234; position: relative; border-bottom: 1px solid #0f172a; }
        .track-lane:nth-child(even) { background-color: #131b2e; }
        .track-lane.selected { background-color: #1e293b; border-left: 3px solid #3b82f6; }
        
        .flash-keyframe { position: absolute; top: 50%; width: 12px; height: 12px; background-color: #f59e0b; border: 1.5px solid #b45309; transform: translate(-50%, -50%) rotate(45deg); z-index: 10; cursor: grab; transition: transform 0.1s, background-color 0.1s; }
        .flash-keyframe:hover { transform: translate(-50%, -50%) rotate(45deg) scale(1.3); background-color: #fbbf24; }
        .flash-keyframe:active { cursor: grabbing; background-color: #ef4444; border-color: #991b1b; }
        
        .flash-interpolation-bar { position: absolute; top: 50%; height: 4px; background: linear-gradient(90deg, #3b82f6, #6366f1); transform: translateY(-50%); z-index: 5; border-radius: 2px; opacity: 0.8; border: 1px solid #1d4ed8; }
        
        .timeline-playhead { position: absolute; top: 0; bottom: 0; width: 2px; background-color: #ef4444; z-index: 30; pointer-events: none; }
        .timeline-playhead-head { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 12px; height: 12px; background-color: #ef4444; clip-path: polygon(0 0, 100% 0, 50% 100%); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- Context Menu Customizado -->
    <div id="timeline-context-menu" class="hidden fixed z-50 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl py-1 w-52 text-xs font-medium text-slate-200 backdrop-blur-md">
        <button id="ctx-add-keyframe" class="w-full text-left px-3 py-2 hover:bg-blue-600 hover:text-white flex items-center space-x-2 transition">
            <i class="fa-solid fa-key text-amber-400 w-4"></i>
            <span>Forçar Keyframe Aqui</span>
        </button>
        <button id="ctx-delete-keyframe" class="w-full text-left px-3 py-2 hover:bg-red-600 hover:text-white flex items-center space-x-2 transition">
            <i class="fa-solid fa-trash-can text-red-400 w-4"></i>
            <span>Excluir Keyframe</span>
        </button>
        <div class="border-t border-slate-800 my-1"></div>
        <button id="ctx-clear-all" class="w-full text-left px-3 py-2 hover:bg-red-700 hover:text-white flex items-center space-x-2 transition text-red-400">
            <i class="fa-solid fa-broom w-4"></i>
            <span>Limpar Linha do Osso</span>
        </button>
    </div>

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-2.5 flex items-center justify-between shrink-0 shadow-lg z-20">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-br from-blue-500 to-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-bone text-base"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm tracking-tight bg-gradient-to-r from-blue-400 via-indigo-300 to-sky-400 bg-clip-text text-transparent">FBX Animator Pro</h1>
                <p class="text-[10px] text-slate-400">Keyframes independentes e sincronização de alterações</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Botão de Auto-Keyframe -->
            <button id="autoKeyBtn" class="bg-slate-800 border border-slate-700 text-slate-400 px-3 py-1.5 rounded-lg text-xs flex items-center space-x-1.5 transition">
                <i class="fa-solid fa-record-vinyl"></i>
                <span>Auto-Key: <strong id="autoKeyStatus" class="text-slate-500">OFF</strong></span>
            </button>

            <label class="cursor-pointer bg-blue-600 hover:bg-blue-500 text-white font-medium px-3 py-1.5 rounded-lg text-xs shadow-lg shadow-blue-600/20 flex items-center space-x-1.5">
                <i class="fa-solid fa-folder-open"></i>
                <span>Carregar FBX</span>
                <input type="file" id="fileInput" accept=".fbx" class="hidden">
            </label>

            <button id="saveProjectBtn" class="bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs flex items-center space-x-1.5 transition">
                <i class="fa-solid fa-floppy-disk"></i>
                <span>Salvar Projeto</span>
            </button>

            <label class="cursor-pointer bg-purple-600 hover:bg-purple-500 text-white px-3 py-1.5 rounded-lg text-xs flex items-center space-x-1.5 transition">
                <i class="fa-solid fa-file-import"></i>
                <span>Importar JSON</span>
                <input type="file" id="importAnimInput" accept=".json" class="hidden">
            </label>

            <button id="exportAnimBtn" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded-lg text-xs flex items-center space-x-1.5 transition">
                <i class="fa-solid fa-download"></i>
                <span>Exportar JSON</span>
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">

        <!-- Viewport 3D -->
        <div id="canvas-container" class="flex-1 h-full relative bg-slate-950">
            <div id="loading-overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md z-40 flex flex-col items-center justify-center transition-opacity hidden">
                <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                <p id="loading-text" class="text-slate-200 text-xs">Carregando Modelo FBX...</p>
            </div>

            <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center pointer-events-none z-10">
                <i class="fa-solid fa-cube text-5xl text-slate-800 mb-3"></i>
                <h3 class="text-sm font-bold text-slate-400">Nenhum Modelo FBX Carregado</h3>
                <p class="text-xs text-slate-600 max-w-sm mt-1">Carregue um arquivo .FBX para iniciar a animação.</p>
            </div>

            <!-- Toolbar de Modos -->
            <div id="transform-toolbar" class="absolute top-4 left-4 bg-slate-900/90 backdrop-blur border border-slate-800 p-1.5 rounded-xl shadow-xl flex items-center space-x-1 z-10 hidden">
                <button id="btn-translate" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition" title="Mover (W)">
                    <i class="fa-solid fa-arrows-up-down-left-right mr-1"></i>Mover
                </button>
                <button id="btn-rotate" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-blue-600 text-white transition" title="Rotacionar (E)">
                    <i class="fa-solid fa-rotate mr-1"></i>Rotacionar
                </button>
                <button id="btn-scale" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition" title="Escala (R)">
                    <i class="fa-solid fa-maximize mr-1"></i>Escala
                </button>
            </div>

            <!-- Painel do Osso Selecionado -->
            <div id="selected-bone-card" class="absolute bottom-4 left-4 bg-slate-900/90 backdrop-blur border border-slate-800 p-3 rounded-xl shadow-xl text-xs z-10 hidden w-72">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center space-x-1.5 text-slate-300 font-semibold truncate flex-1 mr-2">
                        <i class="fa-solid fa-bone text-indigo-400"></i>
                        <input type="text" id="selected-bone-rename-input" class="bg-slate-950 border border-slate-700 rounded px-1.5 py-0.5 text-xs text-blue-400 font-bold focus:outline-none focus:border-blue-500 w-full">
                    </div>
                    <button id="deselectBoneBtn" class="text-slate-500 hover:text-slate-300 text-xs"><i class="fa-solid fa-xmark"></i></button>
                </div>
                
                <div class="space-y-1 font-mono text-[11px]">
                    <div class="flex items-center justify-between">
                        <span class="text-slate-400 w-10">Pos</span>
                        <div class="grid grid-cols-3 gap-1 flex-1">
                            <input type="number" id="posX" step="0.1" class="bg-slate-950 border border-slate-800 rounded px-1 py-0.5 text-center text-slate-200">
                            <input type="number" id="posY" step="0.1" class="bg-slate-950 border border-slate-800 rounded px-1 py-0.5 text-center text-slate-200">
                            <input type="number" id="posZ" step="0.1" class="bg-slate-950 border border-slate-800 rounded px-1 py-0.5 text-center text-slate-200">
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-slate-400 w-10">Rot</span>
                        <div class="grid grid-cols-3 gap-1 flex-1">
                            <input type="number" id="rotX" step="1" class="bg-slate-950 border border-slate-800 rounded px-1 py-0.5 text-center text-slate-200">
                            <input type="number" id="rotY" step="1" class="bg-slate-950 border border-slate-800 rounded px-1 py-0.5 text-center text-slate-200">
                            <input type="number" id="rotZ" step="1" class="bg-slate-950 border border-slate-800 rounded px-1 py-0.5 text-center text-slate-200">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sidebar Direita -->
        <aside class="w-72 bg-slate-900 border-l border-slate-800 flex flex-col shrink-0 z-20">
            <div class="p-3 border-b border-slate-800 font-semibold text-xs text-slate-300 flex items-center justify-between">
                <span>Esqueleto</span>
                <span id="bone-count" class="text-[10px] text-slate-500">0 ossos</span>
            </div>

            <div id="bones-list-container" class="flex-1 overflow-y-auto p-2 space-y-1">
                <div class="text-center py-12 text-slate-500 text-xs">Carregue um FBX...</div>
            </div>

            <div class="p-3 border-t border-slate-800 bg-slate-950/50 space-y-2">
                <button id="addKeyframeBtn" disabled class="w-full bg-amber-600 hover:bg-amber-500 disabled:opacity-40 text-white font-bold py-2 rounded-lg text-xs transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-key"></i>
                    <span>Inserir Keyframe</span>
                </button>
            </div>
        </aside>
    </div>

    <!-- Timeline Completa Multi-Track -->
    <footer class="timeline-container flex flex-col shrink-0 z-30 h-64 border-t border-slate-800">
        <!-- Controles de Playback -->
        <div class="px-4 py-2 bg-slate-900 flex items-center justify-between border-b border-slate-800 shrink-0">
            <div class="flex items-center space-x-2">
                <button id="playBtn" class="w-7 h-7 rounded-lg bg-blue-600 hover:bg-blue-500 text-white flex items-center justify-center transition">
                    <i id="playIcon" class="fa-solid fa-play text-xs"></i>
                </button>
                <button id="stopBtn" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 flex items-center justify-center transition border border-slate-700">
                    <i class="fa-solid fa-stop text-xs"></i>
                </button>
                <div id="active-bone-indicator" class="text-xs text-amber-400 font-medium ml-3 truncate max-w-xs">
                    Nenhum osso selecionado
                </div>
            </div>

            <div class="flex items-center space-x-4 text-xs font-mono">
                <span class="text-slate-400">Tempo: <strong id="current-time-text" class="text-amber-400">0.00s</strong> / 5.00s</span>
            </div>
        </div>

        <!-- Área Dividida -->
        <div class="flex-1 flex overflow-hidden relative">
            <div class="w-56 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 z-10 select-none">
                <div class="h-[26px] bg-slate-950 border-b border-slate-800 px-3 flex items-center text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                    Osso / Animação
                </div>
                <div id="timeline-headers-list" class="flex-1 overflow-y-hidden"></div>
            </div>

            <div id="timeline-scroll-area" class="flex-1 overflow-auto relative select-none bg-slate-950">
                <div id="timeline-tracks-wrapper" class="relative min-w-[800px]">
                    <div id="timeline-ruler" class="timeline-ruler w-full sticky top-0 z-20"></div>

                    <div id="tracks-container" class="relative w-full"></div>

                    <div id="timeline-playhead" class="timeline-playhead" style="left: 0px;">
                        <div class="timeline-playhead-head"></div>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script>
        const DURATION = 5.0;
        let scene, camera, renderer, controls, transformControls, skeletonHelper;
        let currentModel = null;
        let bonesList = [];
        let boneHitboxes = [];
        let highlightMesh = null;
        let selectedBone = null;
        let isPlaying = false;
        let currentTime = 0;
        let lastTime = performance.now();

        let autoKeyEnabled = false;

        let undoStack = [];
        let redoStack = [];
        const MAX_HISTORY = 30;

        let initialBoneTransforms = new Map();
        let boneKeyframes = {};
        let boneTimelineSettings = {};

        const SAVE_PREFIX = 'FBX_RIG_STUDIO_V12_';
        let currentProjectKey = null;
        let currentFileInfo = null;

        let contextMenuTimeTarget = 0;
        let contextMenuKeyframeTarget = null;
        let contextMenuBoneTarget = null;

        let draggedKeyframeData = null;

        const container = document.getElementById('canvas-container');
        const fileInput = document.getElementById('fileInput');
        const importAnimInput = document.getElementById('importAnimInput');
        const loadingOverlay = document.getElementById('loading-overlay');
        const emptyState = document.getElementById('empty-state');
        const transformToolbar = document.getElementById('transform-toolbar');
        const selectedBoneCard = document.getElementById('selected-bone-card');
        const selectedBoneRenameInput = document.getElementById('selected-bone-rename-input');
        const deselectBoneBtn = document.getElementById('deselectBoneBtn');
        const bonesListContainer = document.getElementById('bones-list-container');
        const boneCountEl = document.getElementById('bone-count');
        const addKeyframeBtn = document.getElementById('addKeyframeBtn');
        const exportAnimBtn = document.getElementById('exportAnimBtn');
        const saveProjectBtn = document.getElementById('saveProjectBtn');
        const activeBoneIndicator = document.getElementById('active-bone-indicator');
        const autoKeyBtn = document.getElementById('autoKeyBtn');
        const autoKeyStatus = document.getElementById('autoKeyStatus');

        const btnTranslate = document.getElementById('btn-translate');
        const btnRotate = document.getElementById('btn-rotate');
        const btnScale = document.getElementById('btn-scale');

        const posX = document.getElementById('posX');
        const posY = document.getElementById('posY');
        const posZ = document.getElementById('posZ');
        const rotX = document.getElementById('rotX');
        const rotY = document.getElementById('rotY');
        const rotZ = document.getElementById('rotZ');

        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const stopBtn = document.getElementById('stopBtn');
        const currentTimeText = document.getElementById('current-time-text');
        
        const timelineScrollArea = document.getElementById('timeline-scroll-area');
        const timelineHeadersList = document.getElementById('timeline-headers-list');
        const tracksContainer = document.getElementById('tracks-container');
        const timelineRuler = document.getElementById('timeline-ruler');
        const timelinePlayhead = document.getElementById('timeline-playhead');

        const timelineContextMenu = document.getElementById('timeline-context-menu');
        const ctxAddKeyframe = document.getElementById('ctx-add-keyframe');
        const ctxDeleteKeyframe = document.getElementById('ctx-delete-keyframe');
        const ctxClearAll = document.getElementById('ctx-clear-all');

        let isDraggingTimeline = false;

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x070b14);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 5000);
            camera.position.set(100, 150, 300);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 50, 0);

            transformControls = new THREE.TransformControls(camera, renderer.domElement);
            transformControls.size = 0.85;
            transformControls.setMode('rotate');
            scene.add(transformControls);

            const sphereGeom = new THREE.SphereGeometry(2.5, 16, 16);
            const sphereMat = new THREE.MeshBasicMaterial({ color: 0xeab308, wireframe: true, depthTest: false });
            highlightMesh = new THREE.Mesh(sphereGeom, sphereMat);
            highlightMesh.visible = false;
            highlightMesh.renderOrder = 999;
            scene.add(highlightMesh);

            transformControls.addEventListener('dragging-changed', (e) => {
                controls.enabled = !e.value;
                if (e.value) {
                    pushHistoryState();
                } else if (selectedBone) {
                    // Atualiza ou cria keyframe ao soltar a transformação
                    if (autoKeyEnabled || hasKeyframeAtCurrentTime(selectedBone)) {
                        insertKeyframeForBone(selectedBone, true);
                    }
                    saveProjectState();
                    updateInputsFromBone();
                    updateHitboxPositions();
                }
            });

            transformControls.addEventListener('change', () => {
                if (selectedBone && !isPlaying) {
                    updateInputsFromBone();
                    if (skeletonHelper) skeletonHelper.update();
                    updateHitboxPositions();
                }
            });

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
            dirLight.position.set(200, 400, 200);
            scene.add(dirLight);

            const grid = new THREE.GridHelper(1000, 40, 0x3b82f6, 0x1e293b);
            scene.add(grid);

            setupEventListeners();
            buildRuler();
            window.addEventListener('resize', onWindowResize);
        }

        function pushHistoryState() {
            if (!currentModel) return;
            undoStack.push(serializeProjectState());
            if (undoStack.length > MAX_HISTORY) undoStack.shift();
            redoStack = [];
        }

        function undo() {
            if (!undoStack.length) return;
            redoStack.push(serializeProjectState());
            const prevState = undoStack.pop();
            applySerializedState(prevState);
        }

        function redo() {
            if (!redoStack.length) return;
            undoStack.push(serializeProjectState());
            const nextState = redoStack.pop();
            applySerializedState(nextState);
        }

        function hasKeyframeAtCurrentTime(bone) {
            if (!bone || !boneKeyframes[bone.name]) return false;
            const time = parseFloat(currentTime.toFixed(2));
            return boneKeyframes[bone.name].some(k => Math.abs(k.time - time) <= 0.01);
        }

        function setupEventListeners() {
            btnTranslate.addEventListener('click', () => setTransformMode('translate'));
            btnRotate.addEventListener('click', () => setTransformMode('rotate'));
            btnScale.addEventListener('click', () => setTransformMode('scale'));

            deselectBoneBtn.addEventListener('click', () => selectBone(null));

            autoKeyBtn.addEventListener('click', () => {
                autoKeyEnabled = !autoKeyEnabled;
                if (autoKeyEnabled) {
                    autoKeyBtn.className = "bg-red-600/20 border border-red-500 text-red-300 px-3 py-1.5 rounded-lg text-xs flex items-center space-x-1.5 transition animate-pulse";
                    autoKeyStatus.textContent = "ON";
                    autoKeyStatus.className = "text-red-400 font-bold";
                } else {
                    autoKeyBtn.className = "bg-slate-800 border border-slate-700 text-slate-400 px-3 py-1.5 rounded-lg text-xs flex items-center space-x-1.5 transition";
                    autoKeyStatus.textContent = "OFF";
                    autoKeyStatus.className = "text-slate-500";
                }
            });

            window.addEventListener('keydown', (e) => {
                const isInput = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA';
                
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                    if (e.shiftKey) redo(); else undo();
                    e.preventDefault();
                    return;
                }
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                    redo();
                    e.preventDefault();
                    return;
                }

                if (isInput) return;
                if (e.key === 'w' || e.key === 'W') setTransformMode('translate');
                if (e.key === 'e' || e.key === 'E') setTransformMode('rotate');
                if (e.key === 'r' || e.key === 'R') setTransformMode('scale');
                if (e.key === 'k' || e.key === 'K') insertKeyframeForBone(selectedBone, true);
            });

            selectedBoneRenameInput.addEventListener('change', (e) => {
                if (!selectedBone) return;
                const newName = e.target.value.trim();
                if (newName && newName !== selectedBone.name) {
                    pushHistoryState();
                    renameBone(selectedBone, newName);
                }
            });

            [posX, posY, posZ, rotX, rotY, rotZ].forEach(input => {
                if (input) {
                    input.addEventListener('focus', () => pushHistoryState());
                    input.addEventListener('change', () => {
                        updateBoneFromInputs();
                        if (selectedBone && (autoKeyEnabled || hasKeyframeAtCurrentTime(selectedBone))) {
                            insertKeyframeForBone(selectedBone, true);
                        }
                    });
                }
            });

            saveProjectBtn.addEventListener('click', () => saveProjectState(true));
            fileInput.addEventListener('change', (e) => { if (e.target.files.length) loadFBXFile(e.target.files[0]); });
            
            importAnimInput.addEventListener('change', (e) => {
                if (e.target.files.length) importKeyframesJSON(e.target.files[0]);
                e.target.value = '';
            });

            playBtn.addEventListener('click', () => {
                isPlaying = !isPlaying;
                playIcon.className = isPlaying ? "fa-solid fa-pause" : "fa-solid fa-play";
            });

            stopBtn.addEventListener('click', () => {
                isPlaying = false;
                playIcon.className = "fa-solid fa-play";
                currentTime = 0;
                updateTimelineUI();
                applyPoseAtTime(currentTime);
            });

            timelineScrollArea.addEventListener('scroll', () => {
                timelineHeadersList.scrollTop = timelineScrollArea.scrollTop;
            });

            timelineRuler.addEventListener('mousedown', (e) => {
                if (e.button === 0) {
                    hideContextMenu();
                    isDraggingTimeline = true;
                    seekTimeline(e);
                }
            });

            document.addEventListener('click', (e) => {
                if (!timelineContextMenu.contains(e.target)) hideContextMenu();
            });

            ctxAddKeyframe.addEventListener('click', () => {
                currentTime = contextMenuTimeTarget;
                updateTimelineUI();
                applyPoseAtTime(currentTime);
                if (contextMenuBoneTarget) {
                    selectBone(contextMenuBoneTarget);
                    insertKeyframeForBone(contextMenuBoneTarget, true);
                }
                hideContextMenu();
            });

            ctxDeleteKeyframe.addEventListener('click', () => {
                if (contextMenuKeyframeTarget && contextMenuBoneTarget) {
                    deleteKeyframeAtTime(contextMenuBoneTarget.name, contextMenuKeyframeTarget.time);
                }
                hideContextMenu();
            });

            ctxClearAll.addEventListener('click', () => {
                if (contextMenuBoneTarget) {
                    pushHistoryState();
                    boneKeyframes[contextMenuBoneTarget.name] = [];
                    renderTimelineTracks();
                    applyPoseAtTime(currentTime);
                    saveProjectState();
                }
                hideContextMenu();
            });

            window.addEventListener('mousemove', (e) => { 
                if (isDraggingTimeline) {
                    seekTimeline(e);
                } else if (draggedKeyframeData) {
                    handleKeyframeDrag(e);
                }
            });

            window.addEventListener('mouseup', () => { 
                isDraggingTimeline = false;
                if (draggedKeyframeData) {
                    draggedKeyframeData = null;
                    saveProjectState();
                }
            });

            addKeyframeBtn.addEventListener('click', () => insertKeyframeForBone(selectedBone, true));
            exportAnimBtn.addEventListener('click', exportKeyframesJSON);

            renderer.domElement.addEventListener('pointerdown', onPointerDownSelectBone);
        }

        function hideContextMenu() {
            timelineContextMenu.classList.add('hidden');
        }

        function setTransformMode(mode) {
            transformControls.setMode(mode);
            btnTranslate.className = "px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
            btnRotate.className = "px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
            btnScale.className = "px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition";

            if (mode === 'translate') btnTranslate.className = "px-2.5 py-1 rounded-lg text-xs font-semibold bg-blue-600 text-white transition";
            if (mode === 'rotate') btnRotate.className = "px-2.5 py-1 rounded-lg text-xs font-semibold bg-blue-600 text-white transition";
            if (mode === 'scale') btnScale.className = "px-2.5 py-1 rounded-lg text-xs font-semibold bg-blue-600 text-white transition";
        }

        function renameBone(bone, newName) {
            const oldName = bone.name;
            if (oldName === newName) return;

            if (boneKeyframes[oldName]) {
                boneKeyframes[newName] = boneKeyframes[oldName];
                delete boneKeyframes[oldName];
            } else {
                boneKeyframes[newName] = [];
            }

            if (boneTimelineSettings[oldName]) {
                boneTimelineSettings[newName] = boneTimelineSettings[oldName];
                delete boneTimelineSettings[oldName];
            }

            bone.name = newName;

            if (selectedBone === bone) {
                selectedBoneRenameInput.value = newName;
                activeBoneIndicator.textContent = `Osso Ativo: ${newName}`;
            }

            renderBonesList();
            renderTimelineTracks();
            saveProjectState();
        }

        function loadFBXFile(file) {
            currentFileInfo = { name: file.name, size: file.size, lastModified: file.lastModified };
            currentProjectKey = SAVE_PREFIX + [file.name, file.size, file.lastModified].join('|');
            loadingOverlay.classList.remove('hidden');
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const loader = new THREE.FBXLoader();
                    const object = loader.parse(e.target.result, '');
                    setupFBXModel(object);
                } catch(err) {
                    alert("Erro ao carregar o arquivo FBX.");
                    console.error(err);
                } finally {
                    loadingOverlay.classList.add('hidden');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function setupFBXModel(object) {
            if (currentModel) scene.remove(currentModel);
            if (skeletonHelper) scene.remove(skeletonHelper);
            clearBoneHitboxes();

            undoStack = [];
            redoStack = [];

            selectBone(null);
            bonesList = [];
            boneKeyframes = {};
            boneTimelineSettings = {};
            initialBoneTransforms.clear();

            currentModel = object;

            currentModel.traverse((child) => {
                if (child.isBone) {
                    bonesList.push(child);
                    boneKeyframes[child.name] = [];
                    boneTimelineSettings[child.name] = { visibleInTimeline: true, enabledAnimation: true };
                    initialBoneTransforms.set(child.uuid, {
                        position: child.position.clone(),
                        quaternion: child.quaternion.clone(),
                        scale: child.scale.clone()
                    });
                }
            });

            skeletonHelper = new THREE.SkeletonHelper(currentModel);
            scene.add(skeletonHelper);
            scene.add(currentModel);

            const box = new THREE.Box3().setFromObject(currentModel);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim > 0) {
                const scale = 150 / maxDim;
                currentModel.scale.set(scale, scale, scale);
            }

            createBoneHitboxes();
            emptyState.classList.add('hidden');
            renderBonesList();
            renderTimelineTracks();
            restoreProjectState();
        }

        function createBoneHitboxes() {
            clearBoneHitboxes();
            if (!currentModel) return;

            const box = new THREE.Box3().setFromObject(currentModel);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z) || 100;
            const radius = Math.max(2.5, Math.min(10, maxDim * 0.025));
            const geom = new THREE.SphereGeometry(radius, 10, 10);

            bonesList.forEach(bone => {
                const mat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, depthTest: false });
                const hitbox = new THREE.Mesh(geom, mat);
                hitbox.name = '__bone_picker__' + bone.name;
                hitbox.userData.boneRef = bone;
                hitbox.frustumCulled = false;
                scene.add(hitbox);
                boneHitboxes.push(hitbox);
            });
            updateHitboxPositions();
        }

        function updateHitboxPositions() {
            const worldPos = new THREE.Vector3();
            boneHitboxes.forEach(hb => {
                if (hb.userData.boneRef) {
                    hb.userData.boneRef.getWorldPosition(worldPos);
                    hb.position.copy(worldPos);
                }
            });

            if (selectedBone && highlightMesh) {
                selectedBone.getWorldPosition(worldPos);
                highlightMesh.position.copy(worldPos);
            }
        }

        function clearBoneHitboxes() {
            boneHitboxes.forEach(hb => scene.remove(hb));
            boneHitboxes = [];
        }

        function onPointerDownSelectBone(event) {
            if (event.button !== 0 || transformControls.dragging) return;
            if (!currentModel) return;

            const rect = renderer.domElement.getBoundingClientRect();
            const mouse = new THREE.Vector2(
                ((event.clientX - rect.left) / rect.width) * 2 - 1,
                -((event.clientY - rect.top) / rect.height) * 2 + 1
            );
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);

            const boneHits = raycaster.intersectObjects(boneHitboxes, false);
            if (boneHits.length > 0) {
                const bone = boneHits[0].object.userData.boneRef;
                if (bone) {
                    selectBone(bone);
                    return;
                }
            }
        }

        function renderBonesList() {
            bonesListContainer.innerHTML = '';
            boneCountEl.textContent = `${bonesList.length} ossos`;

            bonesList.forEach(bone => {
                const container = document.createElement('div');
                container.id = `bone-item-${bone.name}`;
                container.className = "group w-full px-2 py-1 rounded-lg text-xs font-mono text-slate-300 hover:bg-slate-800 transition flex items-center justify-between border border-transparent cursor-pointer";

                const labelDiv = document.createElement('div');
                labelDiv.className = "flex items-center space-x-1.5 truncate flex-1 mr-1";
                labelDiv.innerHTML = `<i class="fa-solid fa-bone text-indigo-400 shrink-0 text-[10px]"></i><span class="bone-name-text truncate">${bone.name}</span>`;

                const actionsDiv = document.createElement('div');
                actionsDiv.className = "flex items-center space-x-1 shrink-0";

                const visBtn = document.createElement('button');
                const isVis = boneTimelineSettings[bone.name]?.visibleInTimeline ?? true;
                visBtn.className = `p-1 text-[10px] rounded hover:bg-slate-700 ${isVis ? 'text-blue-400' : 'text-slate-600'}`;
                visBtn.title = isVis ? "Ocultar da Timeline" : "Mostrar na Timeline";
                visBtn.innerHTML = `<i class="fa-solid ${isVis ? 'fa-eye' : 'fa-eye-slash'}"></i>`;
                visBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!boneTimelineSettings[bone.name]) boneTimelineSettings[bone.name] = { visibleInTimeline: true, enabledAnimation: true };
                    boneTimelineSettings[bone.name].visibleInTimeline = !boneTimelineSettings[bone.name].visibleInTimeline;
                    renderBonesList();
                    renderTimelineTracks();
                });

                actionsDiv.appendChild(visBtn);
                container.appendChild(labelDiv);
                container.appendChild(actionsDiv);

                container.addEventListener('click', () => selectBone(bone));
                bonesListContainer.appendChild(container);
            });

            if (selectedBone) {
                const activeBtn = document.getElementById(`bone-item-${selectedBone.name}`);
                if (activeBtn) {
                    activeBtn.classList.add('bg-blue-600/30', 'text-blue-300', 'border-blue-500/50', 'font-bold');
                }
            }
        }

        function selectBone(bone) {
            selectedBone = bone;

            document.querySelectorAll('[id^="bone-item-"]').forEach(el => {
                el.classList.remove('bg-blue-600/30', 'text-blue-300', 'border-blue-500/50', 'font-bold');
            });

            if (selectedBone) {
                if (!boneTimelineSettings[selectedBone.name]) {
                    boneTimelineSettings[selectedBone.name] = { visibleInTimeline: true, enabledAnimation: true };
                }
                boneTimelineSettings[selectedBone.name].visibleInTimeline = true;

                transformControls.attach(selectedBone);
                selectedBoneRenameInput.value = bone.name;
                selectedBoneCard.classList.remove('hidden');
                transformToolbar.classList.remove('hidden');
                addKeyframeBtn.disabled = false;
                activeBoneIndicator.textContent = `Osso Ativo: ${bone.name}`;

                const activeBtn = document.getElementById(`bone-item-${bone.name}`);
                if (activeBtn) {
                    activeBtn.classList.add('bg-blue-600/30', 'text-blue-300', 'border-blue-500/50', 'font-bold');
                    activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }

                highlightMesh.visible = true;
                updateInputsFromBone();
                updateHitboxPositions();
            } else {
                transformControls.detach();
                selectedBoneCard.classList.add('hidden');
                transformToolbar.classList.add('hidden');
                addKeyframeBtn.disabled = true;
                highlightMesh.visible = false;
                activeBoneIndicator.textContent = "Nenhum osso selecionado";
            }

            renderBonesList();
            renderTimelineTracks();

            if (selectedBone) {
                const trackEl = document.getElementById(`track-lane-${selectedBone.name}`);
                if (trackEl) {
                    trackEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        }

        function updateInputsFromBone() {
            if (!selectedBone) return;
            posX.value = selectedBone.position.x.toFixed(2);
            posY.value = selectedBone.position.y.toFixed(2);
            posZ.value = selectedBone.position.z.toFixed(2);

            rotX.value = THREE.MathUtils.radToDeg(selectedBone.rotation.x).toFixed(0);
            rotY.value = THREE.MathUtils.radToDeg(selectedBone.rotation.y).toFixed(0);
            rotZ.value = THREE.MathUtils.radToDeg(selectedBone.rotation.z).toFixed(0);
        }

        function updateBoneFromInputs() {
            if (!selectedBone) return;

            selectedBone.position.set(parseFloat(posX.value) || 0, parseFloat(posY.value) || 0, parseFloat(posZ.value) || 0);
            selectedBone.rotation.set(
                THREE.MathUtils.degToRad(parseFloat(rotX.value) || 0),
                THREE.MathUtils.degToRad(parseFloat(rotY.value) || 0),
                THREE.MathUtils.degToRad(parseFloat(rotZ.value) || 0)
            );

            if (skeletonHelper) skeletonHelper.update();
            updateHitboxPositions();
            saveProjectState();
        }

        // --- INSERÇÃO / ATUALIZAÇÃO INDEPENDENTE DE KEYFRAME ---
        function insertKeyframeForBone(bone, forceCurrentState = true) {
            if (!bone) return;

            pushHistoryState();

            const time = parseFloat(currentTime.toFixed(2));
            const name = bone.name;

            if (!boneKeyframes[name]) boneKeyframes[name] = [];
            
            // Se for o primeiro keyframe e não estiver no tempo zero, grava a pose inicial no tempo 0.00s para permitir interpolação limpa
            if (boneKeyframes[name].length === 0 && time > 0) {
                const init = initialBoneTransforms.get(bone.uuid);
                if (init) {
                    boneKeyframes[name].push({
                        time: 0,
                        position: init.position.clone(),
                        quaternion: init.quaternion.clone().normalize(),
                        scale: init.scale.clone()
                    });
                }
            }

            const frameData = {
                time: time,
                position: bone.position.clone(),
                quaternion: bone.quaternion.clone().normalize(),
                scale: bone.scale.clone()
            };

            // Substitui keyframe se já existir um no mesmo tempo
            boneKeyframes[name] = boneKeyframes[name].filter(k => Math.abs(k.time - time) > 0.01);
            boneKeyframes[name].push(frameData);
            boneKeyframes[name].sort((a, b) => a.time - b.time);

            renderTimelineTracks();
            applyPoseAtTime(currentTime);
            saveProjectState();

            addKeyframeBtn.classList.add('bg-emerald-600');
            setTimeout(() => addKeyframeBtn.classList.remove('bg-emerald-600'), 400);
        }

        function deleteKeyframeAtTime(boneName, time) {
            if (!boneKeyframes[boneName]) return;
            pushHistoryState();
            boneKeyframes[boneName] = boneKeyframes[boneName].filter(k => Math.abs(k.time - time) > 0.01);
            renderTimelineTracks();
            applyPoseAtTime(currentTime);
            saveProjectState();
        }

        function handleKeyframeDrag(e) {
            if (!draggedKeyframeData) return;

            const { bone, keyframeObj, laneEl } = draggedKeyframeData;
            const rect = laneEl.getBoundingClientRect();
            let clickX = e.clientX - rect.left;
            clickX = Math.max(0, Math.min(clickX, rect.width));

            const newTime = parseFloat(((clickX / rect.width) * DURATION).toFixed(2));
            keyframeObj.time = newTime;

            boneKeyframes[bone.name].sort((a, b) => a.time - b.time);

            currentTime = newTime;
            updateTimelineUI();
            renderTimelineTracks();
            applyPoseAtTime(currentTime);
        }

        function renderTimelineTracks() {
            timelineHeadersList.innerHTML = '';
            tracksContainer.innerHTML = '';

            const visibleBones = bonesList.filter(b => {
                const settings = boneTimelineSettings[b.name];
                return settings ? settings.visibleInTimeline : true;
            });

            visibleBones.forEach(bone => {
                const settings = boneTimelineSettings[bone.name] || { visibleInTimeline: true, enabledAnimation: true };
                const isSelected = selectedBone === bone;

                const header = document.createElement('div');
                header.className = `h-[32px] px-2 flex items-center justify-between border-b border-slate-800 font-mono text-xs ${isSelected ? 'bg-blue-950/60 text-blue-300 font-bold border-l-2 border-l-blue-500' : 'text-slate-400 hover:bg-slate-800/50'}`;

                const titleSpan = document.createElement('span');
                titleSpan.className = 'truncate flex-1 mr-1 cursor-pointer';
                titleSpan.textContent = bone.name;
                titleSpan.addEventListener('click', () => selectBone(bone));

                const controlsDiv = document.createElement('div');
                controlsDiv.className = 'flex items-center space-x-1 shrink-0';

                const enableBtn = document.createElement('button');
                enableBtn.className = `p-1 text-[10px] rounded hover:bg-slate-700 ${settings.enabledAnimation ? 'text-emerald-400' : 'text-slate-600'}`;
                enableBtn.title = settings.enabledAnimation ? "Animação Habilitada" : "Animação Desabilitada";
                enableBtn.innerHTML = `<i class="fa-solid ${settings.enabledAnimation ? 'fa-circle-check' : 'fa-circle-xmark'}"></i>`;
                enableBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    settings.enabledAnimation = !settings.enabledAnimation;
                    renderTimelineTracks();
                    applyPoseAtTime(currentTime);
                });

                controlsDiv.appendChild(enableBtn);
                header.appendChild(titleSpan);
                header.appendChild(controlsDiv);
                timelineHeadersList.appendChild(header);

                const lane = document.createElement('div');
                lane.id = `track-lane-${bone.name}`;
                lane.className = `track-lane ${isSelected ? 'selected' : ''}`;
                lane.style.opacity = settings.enabledAnimation ? '1' : '0.4';

                const kfs = boneKeyframes[bone.name] || [];

                for (let i = 0; i < kfs.length - 1; i++) {
                    const k1 = kfs[i];
                    const k2 = kfs[i + 1];

                    const startPct = (k1.time / DURATION) * 100;
                    const endPct = (k2.time / DURATION) * 100;
                    const widthPct = endPct - startPct;

                    const interpBar = document.createElement('div');
                    interpBar.className = 'flash-interpolation-bar';
                    interpBar.style.left = `${startPct}%`;
                    interpBar.style.width = `${widthPct}%`;
                    interpBar.title = `${bone.name}: ${k1.time}s ➔ ${k2.time}s`;

                    lane.appendChild(interpBar);
                }

                kfs.forEach(kf => {
                    const pct = (kf.time / DURATION) * 100;
                    const dot = document.createElement('div');
                    dot.className = 'flash-keyframe';
                    dot.style.left = `${pct}%`;
                    dot.title = `${bone.name} Keyframe: ${kf.time}s`;
                    
                    dot.addEventListener('mousedown', (e) => {
                        if (e.button === 0) {
                            e.stopPropagation();
                            selectBone(bone);
                            pushHistoryState();
                            draggedKeyframeData = { bone, keyframeObj: kf, laneEl: lane };
                        }
                    });

                    dot.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        contextMenuBoneTarget = bone;
                        contextMenuTimeTarget = kf.time;
                        contextMenuKeyframeTarget = kf;

                        ctxDeleteKeyframe.classList.remove('hidden');
                        timelineContextMenu.style.left = `${e.clientX}px`;
                        timelineContextMenu.style.top = `${e.clientY - 80}px`;
                        timelineContextMenu.classList.remove('hidden');
                    });

                    lane.appendChild(dot);
                });

                lane.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    const rect = lane.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    contextMenuBoneTarget = bone;
                    contextMenuTimeTarget = parseFloat(((clickX / rect.width) * DURATION).toFixed(2));
                    contextMenuKeyframeTarget = null;

                    ctxDeleteKeyframe.classList.add('hidden');
                    timelineContextMenu.style.left = `${e.clientX}px`;
                    timelineContextMenu.style.top = `${e.clientY - 80}px`;
                    timelineContextMenu.classList.remove('hidden');
                });

                tracksContainer.appendChild(lane);
            });
        }

        function buildRuler() {
            timelineRuler.innerHTML = '';
            for (let t = 0; t <= DURATION; t += 0.5) {
                const pct = (t / DURATION) * 100;
                const tick = document.createElement('div');
                tick.className = 'timeline-frame-tick major';
                tick.style.left = `${pct}%`;

                const num = document.createElement('div');
                num.className = 'timeline-frame-number';
                num.style.left = `${pct}%`;
                num.textContent = t.toFixed(1) + 's';

                timelineRuler.appendChild(tick);
                timelineRuler.appendChild(num);
            }
        }

        function seekTimeline(e) {
            const rect = tracksContainer.getBoundingClientRect();
            let x = e.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            
            currentTime = (x / rect.width) * DURATION;
            updateTimelineUI();
            applyPoseAtTime(currentTime);
        }

        function updateTimelineUI() {
            const pct = (currentTime / DURATION) * 100;
            timelinePlayhead.style.left = `${pct}%`;
            currentTimeText.textContent = currentTime.toFixed(2) + 's';
        }

        function applyPoseAtTime(time) {
            if (!currentModel) return;

            bonesList.forEach(bone => {
                const settings = boneTimelineSettings[bone.name];
                
                if (settings && !settings.enabledAnimation) {
                    const init = initialBoneTransforms.get(bone.uuid);
                    if (init) {
                        bone.position.copy(init.position);
                        bone.quaternion.copy(init.quaternion);
                        bone.scale.copy(init.scale);
                        bone.updateMatrixWorld(true);
                    }
                    return;
                }

                const kfs = boneKeyframes[bone.name];
                
                if (!kfs || kfs.length === 0) {
                    const init = initialBoneTransforms.get(bone.uuid);
                    if (init) {
                        bone.position.copy(init.position);
                        bone.quaternion.copy(init.quaternion);
                        bone.scale.copy(init.scale);
                        bone.updateMatrixWorld(true);
                    }
                    return;
                }

                if (time <= kfs[0].time) {
                    const k = kfs[0];
                    bone.position.copy(k.position);
                    bone.quaternion.copy(k.quaternion);
                    bone.scale.copy(k.scale);
                    bone.updateMatrixWorld(true);
                    return;
                }

                const last = kfs[kfs.length - 1];
                if (time >= last.time) {
                    bone.position.copy(last.position);
                    bone.quaternion.copy(last.quaternion);
                    bone.scale.copy(last.scale);
                    bone.updateMatrixWorld(true);
                    return;
                }

                for (let i = 0; i < kfs.length - 1; i++) {
                    const k1 = kfs[i];
                    const k2 = kfs[i + 1];

                    if (time >= k1.time && time <= k2.time) {
                        const span = k2.time - k1.time;
                        const alpha = span > 0 ? (time - k1.time) / span : 0;
                        
                        bone.position.lerpVectors(k1.position, k2.position, alpha);
                        bone.quaternion.slerpQuaternions(k1.quaternion, k2.quaternion, alpha);
                        bone.quaternion.normalize();
                        bone.scale.lerpVectors(k1.scale, k2.scale, alpha);
                        bone.updateMatrixWorld(true);
                        break;
                    }
                }
            });

            if (skeletonHelper) skeletonHelper.update();
            updateHitboxPositions();
            if (selectedBone) updateInputsFromBone();
        }

        function serializeProjectState() {
            const transforms = {};
            bonesList.forEach(bone => {
                transforms[bone.uuid] = {
                    name: bone.name,
                    position: bone.position.toArray(),
                    quaternion: bone.quaternion.toArray(),
                    scale: bone.scale.toArray()
                };
            });

            const keyframes = {};
            Object.keys(boneKeyframes).forEach(name => {
                keyframes[name] = (boneKeyframes[name] || []).map(k => ({
                    time: k.time,
                    position: k.position.toArray(),
                    quaternion: k.quaternion.toArray(),
                    scale: k.scale.toArray()
                }));
            });

            return {
                version: 12,
                file: currentFileInfo,
                currentTime,
                selectedBone: selectedBone ? selectedBone.name : null,
                transforms,
                keyframes,
                timelineSettings: boneTimelineSettings,
                autoKeyEnabled
            };
        }

        function applySerializedState(state) {
            if (!state || !currentModel) return;

            const byUUID = new Map(bonesList.map(b => [b.uuid, b]));
            const byName = new Map(bonesList.map(b => [b.name, b]));

            if (state.transforms) {
                Object.entries(state.transforms).forEach(([uuid, data]) => {
                    const bone = byUUID.get(uuid) || byName.get(data.name);
                    if (!bone) return;
                    if (Array.isArray(data.position)) bone.position.fromArray(data.position);
                    if (Array.isArray(data.quaternion)) bone.quaternion.fromArray(data.quaternion);
                    if (Array.isArray(data.scale)) bone.scale.fromArray(data.scale);
                });
            }

            if (state.timelineSettings) {
                boneTimelineSettings = state.timelineSettings;
            }

            boneKeyframes = {};
            bonesList.forEach(b => boneKeyframes[b.name] = []);
            if (state.keyframes) {
                Object.entries(state.keyframes).forEach(([name, arr]) => {
                    const bone = byName.get(name);
                    if (!bone) return;
                    boneKeyframes[name] = (arr || []).map(k => ({
                        time: Number(k.time) || 0,
                        position: new THREE.Vector3().fromArray(k.position || [0,0,0]),
                        quaternion: new THREE.Quaternion().fromArray(k.quaternion || [0,0,0,1]).normalize(),
                        scale: new THREE.Vector3().fromArray(k.scale || [1,1,1])
                    })).sort((a,b) => a.time - b.time);
                });
            }

            currentTime = THREE.MathUtils.clamp(Number(state.currentTime) || 0, 0, DURATION);
            renderBonesList();
            renderTimelineTracks();
            updateTimelineUI();
            applyPoseAtTime(currentTime);

            if (state.selectedBone) {
                const bone = byName.get(state.selectedBone);
                selectBone(bone || null);
            } else {
                selectBone(null);
            }
        }

        function saveProjectState(showMessage = false) {
            if (!currentProjectKey || !currentModel) return;
            try {
                localStorage.setItem(currentProjectKey, JSON.stringify(serializeProjectState()));
                if (showMessage) {
                    saveProjectBtn.classList.remove('bg-emerald-700');
                    saveProjectBtn.classList.add('bg-blue-600');
                    const old = saveProjectBtn.querySelector('span');
                    if (old) old.textContent = 'Salvo';
                    setTimeout(() => {
                        saveProjectBtn.classList.remove('bg-blue-600');
                        saveProjectBtn.classList.add('bg-emerald-700');
                        if (old) old.textContent = 'Salvar Projeto';
                    }, 900);
                }
            } catch (err) {
                console.warn('Não foi possível salvar:', err);
            }
        }

        function restoreProjectState() {
            if (!currentProjectKey || !currentModel) return;
            const raw = localStorage.getItem(currentProjectKey);
            if (!raw) return;

            try {
                const state = JSON.parse(raw);
                applySerializedState(state);
            } catch (err) {
                console.warn('Estado salvo inválido:', err);
            }
        }

        function exportKeyframesJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(boneKeyframes, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `rig_keyframes.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importKeyframesJSON(file) {
            if (!currentModel) {
                alert("Por favor, carregue um modelo FBX primeiro.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    pushHistoryState();

                    const byName = new Map(bonesList.map(b => [b.name, b]));
                    
                    Object.entries(importedData).forEach(([boneName, kfs]) => {
                        if (byName.has(boneName) && Array.isArray(kfs)) {
                            boneKeyframes[boneName] = kfs.map(k => ({
                                time: Number(k.time) || 0,
                                position: new THREE.Vector3().fromArray(k.position || [0, 0, 0]),
                                quaternion: new THREE.Quaternion().fromArray(k.quaternion || [0, 0, 0, 1]).normalize(),
                                scale: new THREE.Vector3().fromArray(k.scale || [1, 1, 1])
                            })).sort((a, b) => a.time - b.time);

                            if (!boneTimelineSettings[boneName]) {
                                boneTimelineSettings[boneName] = { visibleInTimeline: true, enabledAnimation: true };
                            }
                        }
                    });

                    renderTimelineTracks();
                    applyPoseAtTime(currentTime);
                    saveProjectState();
                    alert("Keyframes importados com sucesso!");
                } catch (err) {
                    alert("Erro ao processar o arquivo JSON.");
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate(now) {
            requestAnimationFrame(animate);
            const delta = (now - lastTime) / 1000;
            lastTime = now;

            if (isPlaying) {
                currentTime += delta;
                if (currentTime >= DURATION) currentTime = 0;
                updateTimelineUI();
                applyPoseAtTime(currentTime);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = () => {
            initScene();
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
